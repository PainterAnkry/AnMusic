<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- AnMusic 应用图标前景层（自适应图标用）：同一枚音符等比缩到中心安全区。
     自适应图标会被系统裁成圆形/方形/水滴形，前景必须留在中心约 66% 内，
     所以这里把图形整体缩到 0.66 并居中，避免边角被裁掉。 -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">

    <!-- 符干 -->
    <rect x="195" y="151.4" width="10.6" height="142.6" fill="#FFFFFF" />
    <rect x="298" y="131.6" width="10.6" height="142.6" fill="#FFFFFF" />

    <!-- 符梁 -->
    <path d="M195 151.4 L308.5 131.6 L308.5 160.7 L195 180.7 Z" fill="#FFFFFF" />

    <!-- 符头 -->
    <ellipse cx="170" cy="290" rx="33" ry="25.1" fill="#FFFFFF" />
    <ellipse cx="272.9" cy="270.2" rx="33" ry="25.1" fill="#FFFFFF" />
</svg>
